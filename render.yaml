services:
  - type: web
    name: scrapy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: scrapyv1
      - key: VERCEL_FRONTEND_ORIGIN
        sync: false
      - key: SCRAPE_API_KEY
        sync: false
      - key: PUBLIC_SCRAPE_ENABLED
        value: "true"
      - key: PUBLIC_SCRAPE_SHARED_COOLDOWN
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
